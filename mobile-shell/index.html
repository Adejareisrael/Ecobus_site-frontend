<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover,width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#2563eb" />
    <title>Ecobus</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        align-items: center;
        background: #071327;
        color: #f8fafc;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
      }

      main {
        margin: auto;
        max-width: 360px;
      }

      img {
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        height: auto;
        margin-bottom: 24px;
        max-width: 140px;
      }

      h1 {
        font-size: 28px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Not shown at runtime — Capacitor's server.url config (see
      capacitor.config.ts) loads the live site directly as the app's own
      origin instead, which is what actually gives native plugins (file
      saving, sharing, the back button, Google Sign-in) access to the page.
      This file only exists because the Capacitor CLI requires webDir to
      point at some valid directory with an index.html to build.
    -->
    <main>
      <img src="ecobus-logo.jpeg" alt="Ecobus" />
      <h1>Ecobus</h1>
    </main>
  </body>
</html>
